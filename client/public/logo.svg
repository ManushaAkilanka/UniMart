<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <!-- Shield icon: dark background with white check and green border -->
  <!-- Light mode: dark navy background; Dark mode: invert to bright surface via CSS currentColor trick -->
  <rect x="2" y="6" width="28" height="28" rx="8" fill="#10B981"/>
  <path d="M9 13H23C23 18 20 25 16 27C12 25 9 18 9 13Z" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" fill="#059669"/>
  <path d="M12 17L15 20L20 15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "Uni" in near-black for light, near-white for dark – controlled via CSS fill on the SVG text -->
  <text x="38" y="27" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5px" fill="currentColor"><tspan fill="currentColor">Uni</tspan><tspan fill="#10B981">Mart</tspan></text>
</svg>
